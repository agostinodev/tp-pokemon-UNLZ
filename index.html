<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/img/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./src/css/style.css">
    <title>Pokédex</title>
</head>

<body>
    <!-- Header -->
    <header class="container d-flex align-items-center">
            <img class="img-logo" src="../assets/img/Logo.png" alt="Logo pokemon">
        <span class="fs-2">Pokédex</span>
    </header>
    <!-- Main -->
    <main class="container mt-3">
        <!-- Search conatainerr  -->
        <section class="container">
            <div class="search-container">
                <h1>Busca cualquier Pokémon, al instante.</h1>
                <P>Consulta por nombre o número.</P>
                <!-- Input -->
                <div class="mb-3">
                    <div class="row gap-3">
                        <div class="col-12 col-lg-6">
                            <input id="input-search" type="text" class="form-control me-2"
                                placeholder="Pikachu, bulbasour, 25...">
                        </div>
                        <div class="col-12 col-lg-2">
                            <button id="btn-search" type="button" class="buttons me-2">Buscar</button>
                        </div>
                        <div class="col-12 col-lg-2">
                            <button id="btn-clean" type="button" class=" buttons">Limpiar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Pokemons container -->
        <section class="container">
            <!-- Spinner -->
            <div id="spinner" class="d-flex justify-content-center d-none">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <!-- Cards pokemons container -->
            <div class="container">
                <!-- Contenedor del renderizado -->
                <div id="container-cards" class="row row-cols-4 justify-content-center  gap-3">
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="/src/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
