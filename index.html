<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/img/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Pokédex</title>
</head>

<body>
    <!-- Header -->
    <header class="container">
        <img src="../assets/img/Logo.png" alt="Logo pokemon">
        <span>Pokedex</span>
    </header>
    <!-- Main -->
    <main class="container">
        <!--Contenedor buscador  -->
        <section class="container">
            <h1>Busca cualquier Pokémon, al instante.</h1>
            <P>Consulta por nombre o número.</P>
            <!-- Input -->
            <div class="mb-3 d-flex">
                <label for="input-search" class="form-label"></label>
                <input id="input-search" type="text" class="form-control" placeholder="Pikachu, bulbasour, 25...">
                <button id="btn-search" type="button" class="btn btn-secondary">Buscar</button>
                <button id="btn-clean" type="button" class="btn btn-secondary">Limpiar</button>
            </div>
            
        </section>
        <!-- Contendor de los pokemons -->
        <section class="container">
            <!-- Spinner -->
            <div id="spinner" class="d-flex justify-content-center d-none">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <!-- Contenedor de las cards -->
            <div class="container">
                <!-- Contenedor del renderizado -->
                <div id="container-cards" class="row row-cols-4 justify-content-center justify-content-md-start gap-3">
                    <!-- Card pokemon -->
                    <!-- <div class="card col" style="width: 18rem;">
                        <img src="" class="card-img-top" alt="">
                        <div class="card-body">
                            <h5 class="card-title">Card title</h5>
                            <p class="card-text">Some quick example text to build on the card title and make up the bulk
                                of
                                the card’s content.</p>
                            <a href="#" class="btn btn-primary">Go somewhere</a>
                        </div>
                    </div> -->
                </div>  
            </div>
        </section>
    </main>
    <script type="module" src="/src/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
